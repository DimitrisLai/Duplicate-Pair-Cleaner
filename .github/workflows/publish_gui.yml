name: Windows GUI v3.0.0 — build and release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_gui.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    name: Regression — ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test core and GUI model
        run: python -m unittest -q test_cleaner.py test_gui_logic.py
      - name: Import GUI
        run: python -c "import gui_app; print('GUI imported')"
  windows:
    name: Package portable Windows EXE
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Windows packager
        run: python -m pip install "pyinstaller>=6.10,<7"
      - name: Build portable EXE
        run: python -m PyInstaller --clean --noconfirm --windowed --onedir --name DuplicatePairCleaner gui_app.py
      - name: Verify package files
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/DuplicatePairCleaner/DuplicatePairCleaner.exe')) { throw 'EXE missing' }
          if (-not (Test-Path 'dist/DuplicatePairCleaner/_internal')) { throw 'Runtime folder missing' }
          Write-Output 'EXE and runtime files exist'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-gui
          path: dist/DuplicatePairCleaner/
          if-no-files-found: error
          retention-days: 30
  manual:
    name: Generate and check designer manual
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build PDF
        run: |
          python -m pip install "reportlab>=4,<5" "pypdf>=5,<7" "pillow>=10,<13"
          python scripts/build_manual.py
      - name: Validate PDF
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          pdf=Path('dist/Duplicate-Pair-Cleaner-v3.0.0-User-Manual.pdf')
          assert pdf.stat().st_size > 50000, 'PDF unexpectedly small'
          assert len(PdfReader(str(pdf)).pages)==9, 'Expected nine full manual pages'
          print('Nine-page manual validated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: dist/Duplicate-Pair-Cleaner-v3.0.0-User-Manual.pdf
          if-no-files-found: error
  release:
    name: Publish portable application and PDF
    needs: [windows,manual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-gui
          path: stage/DuplicatePairCleaner
      - uses: actions/download-artifact@v4
        with:
          name: documentation
          path: stage
      - name: Assemble a self-contained ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          root=Path('stage')
          out=Path('Duplicate-Pair-Cleaner-v3.0.0-Windows-Portable.zip')
          with ZipFile(out,'w',ZIP_DEFLATED,compresslevel=7) as z:
              for p in (root/'DuplicatePairCleaner').rglob('*'):
                  if p.is_file(): z.write(p, p.relative_to(root).as_posix())
              for item in ('LICENSE','README.md','docs/GUI_USER_GUIDE.md'):
                  z.write(item,item)
              z.write(root/'Duplicate-Pair-Cleaner-v3.0.0-User-Manual.pdf',
                      'Duplicate-Pair-Cleaner-v3.0.0-User-Manual.pdf')
          with ZipFile(out) as z:
              assert z.testzip() is None and 'DuplicatePairCleaner/DuplicatePairCleaner.exe' in z.namelist()
          print('Portable bundle ready:',out.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-v3.0.0
          path: Duplicate-Pair-Cleaner-v3.0.0-Windows-Portable.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Publish v3.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.0.0 Duplicate-Pair-Cleaner-v3.0.0-Windows-Portable.zip stage/Duplicate-Pair-Cleaner-v3.0.0-User-Manual.pdf --target "$GITHUB_SHA" --title 'Duplicate Pair Cleaner v3.0.0 - Final Windows GUI' --notes-file docs/RELEASE_NOTES_v3.0.0.md --latest