name: Python tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run core and GUI-model regression tests
        run: python -m unittest -v test_cleaner.py test_gui_logic.py test_theme_prefs.py
      - name: Check GUI module import
        run: python -c "import gui_app,gui_logic; print(gui_logic.APP_VERSION)"
