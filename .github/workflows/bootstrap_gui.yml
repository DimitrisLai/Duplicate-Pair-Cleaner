name: Install GUI sources
on:
  push:
    paths:
      - 'release/v3-source-bundle.b64'
permissions:
  contents: write
  actions: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Extract verified source archive
        run: |
          python - <<'PY'
          import base64,io,tarfile,pathlib
          data=base64.b64decode(pathlib.Path('release/v3-source-bundle.b64').read_text().strip())
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
              for x in archive.getmembers():
                  path=pathlib.PurePosixPath(x.name)
                  if x.issym() or x.islnk() or path.is_absolute() or '..' in path.parts or not x.isfile():
                      raise ValueError('Unexpected member: '+x.name)
              archive.extractall('.',filter='data')
          print('Source bundle unpacked')
          PY
      - name: Preserve core logic and update release version
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename,old,new in [
            ('file_pair_cleaner.py','VERSION = "2.2.0"','VERSION = "3.0.0"'),
            ('test_cleaner.py',"self.assertIn('2.2.0', output.getvalue())","self.assertIn('3.0.0', output.getvalue())")]:
              p=Path(filename);content=p.read_text(encoding='utf-8')
              if old in content:p.write_text(content.replace(old,new),encoding='utf-8')
              elif new not in content:raise RuntimeError('Unexpected version: '+filename)
          PY
      - name: Verify 42 tests
        run: python -m unittest -q test_cleaner.py test_gui_logic.py
      - name: Commit reviewed GUI source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f release/v3-source-bundle.b64
          git commit -m 'Add v3.0.0 Windows GUI, documentation, tests and build workflow'
          git push origin HEAD:main
      - name: Start Windows GUI build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish_gui.yml --ref main
